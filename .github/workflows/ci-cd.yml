name: MyProfile CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: myprofile

jobs:

  # ============================================================
  # BUILD + TEST + DOCKER HUB
  # ============================================================

  build-test-push:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Checkout source code
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Setup Python
      # ----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip


      # ----------------------------------------------------------
      # 3. Install Python dependencies
      # ----------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ----------------------------------------------------------
      # 4. Validate Python application
      # ----------------------------------------------------------

      - name: Validate Python application
        run: |
          python -m py_compile app.py

          python - <<'PY'
          from app import app

          print("Flask application import: OK")

          with app.test_client() as client:

              response = client.get("/")

              print("Home page status:", response.status_code)

              if response.status_code != 200:
                  raise SystemExit("Home page test failed")

              response = client.get("/health")

              print("Health endpoint status:", response.status_code)

              if response.status_code != 200:
                  raise SystemExit("Health endpoint test failed")

              response = client.get("/metrics")

              print("Metrics endpoint status:", response.status_code)

              if response.status_code != 200:
                  raise SystemExit("Metrics endpoint test failed")

          print("Python application tests: OK")
          PY


      # ----------------------------------------------------------
      # 5. Build Docker image ONCE
      # ----------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t ${APP_NAME}:test \
            -t ${APP_NAME}:${GITHUB_SHA} \
            .


      # ----------------------------------------------------------
      # 6. Start test container
      # ----------------------------------------------------------

      - name: Start MyProfile container
        run: |
          docker run -d \
            --name ${APP_NAME}-test \
            -p 5000:5000 \
            ${APP_NAME}:test


      # ----------------------------------------------------------
      # 7. Wait for application health
      # ----------------------------------------------------------

      - name: Wait for application
        shell: bash
        run: |

          set -e

          echo "Waiting for MyProfile application..."

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:5000/health; then

              echo
              echo "Health check: OK"
              exit 0

            fi

            echo "Attempt $i/30..."
            sleep 2

          done

          echo "Application failed to start."

          docker logs ${APP_NAME}-test

          exit 1


      # ----------------------------------------------------------
      # 8. Test home page
      # ----------------------------------------------------------

      - name: Test home page
        run: |
          curl \
            --fail \
            --silent \
            http://127.0.0.1:5000/ \
            > /dev/null

          echo "Home page test: OK"


      # ----------------------------------------------------------
      # 9. Test Prometheus metrics endpoint
      # ----------------------------------------------------------

      - name: Test Prometheus metrics
        run: |
          curl \
            --fail \
            --silent \
            http://127.0.0.1:5000/metrics \
            > /dev/null

          echo "Prometheus metrics test: OK"


      # ----------------------------------------------------------
      # 10. Show container logs
      # ----------------------------------------------------------

      - name: Show container logs
        if: always()
        run: |
          docker logs ${APP_NAME}-test


      # ----------------------------------------------------------
      # 11. Remove test container
      # ----------------------------------------------------------

      - name: Remove test container
        if: always()
        run: |
          docker rm -f ${APP_NAME}-test || true


      # ==========================================================
      # DOCKER HUB
      # ==========================================================

      # ----------------------------------------------------------
      # 12. Login to Docker Hub
      # ----------------------------------------------------------

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ----------------------------------------------------------
      # 13. Tag the already-tested Docker image
      # ----------------------------------------------------------

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag \
            ${APP_NAME}:${GITHUB_SHA} \
            ${DOCKERHUB_USERNAME}/${APP_NAME}:${GITHUB_SHA}

          docker tag \
            ${APP_NAME}:${GITHUB_SHA} \
            ${DOCKERHUB_USERNAME}/${APP_NAME}:latest


      # ----------------------------------------------------------
      # 14. Push the already-tested image
      # ----------------------------------------------------------

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push \
            ${DOCKERHUB_USERNAME}/${APP_NAME}:${GITHUB_SHA}

          docker push \
            ${DOCKERHUB_USERNAME}/${APP_NAME}:latest

          echo "Docker Hub push completed successfully"


  # ============================================================
  # DEPLOY TO K3S USING AWS SYSTEMS MANAGER
  # ============================================================

  deploy:

    runs-on: ubuntu-latest

    needs:
      - build-test-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ----------------------------------------------------------
      # 15. Checkout repository
      # ----------------------------------------------------------

      - name: Checkout deployment configuration
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 16. Configure AWS credentials
      #
      # OIDC cannot be used in your AWS organization because the
      # required IAM OIDC provider is blocked by an SCP.
      # Therefore these are GitHub repository secrets.
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ----------------------------------------------------------
      # 17. Verify EC2 is registered with SSM
      # ----------------------------------------------------------

      - name: Verify EC2 SSM connectivity
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |

          set -euo pipefail

          echo "Checking EC2 SSM status..."

          aws ssm describe-instance-information \
            --region "${AWS_REGION}" \
            --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
            --query "InstanceInformationList[0].[InstanceId,PingStatus,AgentVersion]" \
            --output table


      # ----------------------------------------------------------
      # 18. Create SSM deployment script
      # ----------------------------------------------------------

      - name: Create SSM deployment script
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |

          set -euo pipefail

          cat > deploy-ssm.sh <<'REMOTE_SCRIPT'
          #!/bin/bash

          set -euo pipefail

          export KUBECONFIG=/home/ubuntu/.kube/config

          NAMESPACE="myprofile"
          WORKDIR="/tmp/myprofile-k8s-GITHUB_SHA_PLACEHOLDER"

          IMAGE="DOCKER_IMAGE_PLACEHOLDER"

          echo "=========================================="
          echo "MyProfile Kubernetes Deployment"
          echo "=========================================="

          echo "Namespace : ${NAMESPACE}"
          echo "Image     : ${IMAGE}"

          # ------------------------------------------------------
          # Prepare temporary workspace
          # ------------------------------------------------------

          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"

          cd "${WORKDIR}"


          # ------------------------------------------------------
          # Download Kubernetes manifests from the exact commit
          # ------------------------------------------------------

          echo "Downloading namespace.yaml..."

          curl -fsSL \
            "https://raw.githubusercontent.com/haque-ashanur/myprofile_v2/GITHUB_SHA_PLACEHOLDER/k8s/namespace.yaml" \
            -o namespace.yaml


          echo "Downloading deployment.yaml..."

          curl -fsSL \
            "https://raw.githubusercontent.com/haque-ashanur/myprofile_v2/GITHUB_SHA_PLACEHOLDER/k8s/deployment.yaml" \
            -o deployment.yaml


          echo "Downloading service.yaml..."

          curl -fsSL \
            "https://raw.githubusercontent.com/haque-ashanur/myprofile_v2/GITHUB_SHA_PLACEHOLDER/k8s/service.yaml" \
            -o service.yaml


          echo "Downloading ingress.yaml..."

          curl -fsSL \
            "https://raw.githubusercontent.com/haque-ashanur/myprofile_v2/GITHUB_SHA_PLACEHOLDER/k8s/ingress.yaml" \
            -o ingress.yaml


          # ------------------------------------------------------
          # Replace Docker Hub placeholder
          # ------------------------------------------------------

          echo "Configuring Docker image..."

          sed -i \
            "s|YOUR_DOCKERHUB_USERNAME/myprofile:latest|${IMAGE}|g" \
            deployment.yaml


          # ------------------------------------------------------
          # Deploy namespace
          # ------------------------------------------------------

          echo "Applying namespace..."

          kubectl apply \
            -f namespace.yaml


          # ------------------------------------------------------
          # Deploy application
          # ------------------------------------------------------

          echo "Applying deployment..."

          kubectl apply \
            -f deployment.yaml


          # ------------------------------------------------------
          # Deploy service
          # ------------------------------------------------------

          echo "Applying service..."

          kubectl apply \
            -f service.yaml


          # ------------------------------------------------------
          # Deploy ingress
          # ------------------------------------------------------

          echo "Applying ingress..."

          kubectl apply \
            -f ingress.yaml


          # ------------------------------------------------------
          # Wait for rolling update
          # ------------------------------------------------------

          echo
          echo "Waiting for MyProfile rollout..."

          kubectl \
            -n "${NAMESPACE}" \
            rollout status \
            deployment/myprofile \
            --timeout=180s


          # ------------------------------------------------------
          # Show pods
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "MyProfile Pods"
          echo "=========================================="

          kubectl \
            -n "${NAMESPACE}" \
            get pods \
            -o wide


          # ------------------------------------------------------
          # Show deployment
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "Deployment"
          echo "=========================================="

          kubectl \
            -n "${NAMESPACE}" \
            get deployment


          # ------------------------------------------------------
          # Show service
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "Service"
          echo "=========================================="

          kubectl \
            -n "${NAMESPACE}" \
            get service


          # ------------------------------------------------------
          # Show ingress
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "Ingress"
          echo "=========================================="

          kubectl \
            -n "${NAMESPACE}" \
            get ingress


          # ------------------------------------------------------
          # Final status
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "MyProfile deployment SUCCESS"
          echo "=========================================="

          # Cleanup
          rm -rf "${WORKDIR}"

          REMOTE_SCRIPT


          # ------------------------------------------------------
          # Replace placeholders
          # ------------------------------------------------------

          sed -i \
            "s|DOCKER_IMAGE_PLACEHOLDER|${DOCKERHUB_USERNAME}/myprofile:${GITHUB_SHA}|g" \
            deploy-ssm.sh

          sed -i \
            "s|GITHUB_SHA_PLACEHOLDER|${GITHUB_SHA}|g" \
            deploy-ssm.sh


      # ----------------------------------------------------------
      # 19. Convert script into valid SSM JSON
      # ----------------------------------------------------------

      - name: Create SSM parameters JSON
        run: |

          set -euo pipefail

          jq -n \
            --rawfile script deploy-ssm.sh \
            '{commands: [$script]}' \
            > ssm-parameters.json

          echo "SSM parameters JSON created successfully."


      # ----------------------------------------------------------
      # 20. Send command to EC2
      # ----------------------------------------------------------

      - name: Send deployment command through SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GITHUB_SHA: ${{ github.sha }}
        run: |

          set -euo pipefail

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "MyProfile deployment ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 600 \
            --max-errors "0" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID:"
          echo "${COMMAND_ID}"

          echo "${COMMAND_ID}" > ssm-command-id.txt


      # ----------------------------------------------------------
      # 21. Wait for SSM command
      # ----------------------------------------------------------

      - name: Wait for EC2 deployment
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GITHUB_SHA: ${{ github.sha }}
        run: |

          set -euo pipefail

          COMMAND_ID=$(cat ssm-command-id.txt)

          echo "Waiting for SSM execution..."

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Attempt ${i}/60"
            echo "SSM status: ${STATUS}"

            case "${STATUS}" in

              Success)

                echo
                echo "=========================================="
                echo "SSM deployment SUCCESS"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|DeliveryTimedOut|Undeliverable)

                echo
                echo "=========================================="
                echo "SSM deployment FAILED"
                echo "=========================================="

                echo
                echo "---------- STDOUT ----------"

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text

                echo
                echo "---------- STDERR ----------"

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text

                exit 1
                ;;

              *)
                sleep 5
                ;;

            esac

          done

          echo "SSM execution timed out."

          exit 1


      # ----------------------------------------------------------
      # 22. Final deployment verification
      # ----------------------------------------------------------

      - name: Verify Kubernetes deployment
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |

          set -euo pipefail

          cat > verify-ssm.json <<'EOF'
          {
            "commands": [
              "export KUBECONFIG=/home/ubuntu/.kube/config",
              "echo '--- Nodes ---'",
              "kubectl get nodes",
              "echo '--- MyProfile Pods ---'",
              "kubectl -n myprofile get pods -o wide",
              "echo '--- Deployment ---'",
              "kubectl -n myprofile get deployment myprofile",
              "echo '--- Service ---'",
              "kubectl -n myprofile get service"
            ]
          }
          EOF

          echo "Running final Kubernetes verification..."

          VERIFY_COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify MyProfile deployment" \
            --parameters file://verify-ssm.json \
            --timeout-seconds 120 \
            --max-errors "0" \
            --query "Command.CommandId" \
            --output text)

          echo "Verification Command ID:"
          echo "${VERIFY_COMMAND_ID}"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${VERIFY_COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Verification status: ${STATUS}"

            case "${STATUS}" in

              Success)

                echo
                echo "=========================================="
                echo "Kubernetes verification SUCCESS"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${VERIFY_COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|DeliveryTimedOut|Undeliverable)

                echo
                echo "Kubernetes verification FAILED"

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${VERIFY_COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text

                exit 1
                ;;

              *)
                sleep 5
                ;;

            esac

          done

          echo "Kubernetes verification timed out."
          exit 1