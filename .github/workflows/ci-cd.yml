name: MyProfile CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  APP_IMAGE: myprofile

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        run: |
          python -m py_compile app.py
          python -c "from app import app; print('Flask application import: OK')"

      - name: Build Docker image
        run: |
          docker build \
            -t $APP_IMAGE:latest \
            -t $APP_IMAGE:${{ github.sha }} \
            .

      - name: Start MyProfile container
        run: |
          docker run -d \
            --name myprofile-test \
            -p 5000:5000 \
            $APP_IMAGE:latest

      - name: Wait for application
        shell: bash
        run: |
          set -e
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo
              echo "Health check: OK"
              exit 0
            fi
            sleep 2
          done
          docker logs myprofile-test
          exit 1

      - name: Test home page
        run: |
          curl --fail --silent http://127.0.0.1:5000/ > /dev/null
          echo "Home page test: OK"

      - name: Test Prometheus metrics
        run: |
          curl --fail --silent http://127.0.0.1:5000/metrics | grep -q "myprofile_app_info"
          echo "Prometheus metrics test: OK"

      - name: Show container logs
        if: always()
        run: docker logs myprofile-test

      - name: Remove test container
        if: always()
        run: docker rm -f myprofile-test

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag tested Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag $APP_IMAGE:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/myprofile:latest
          docker tag $APP_IMAGE:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/myprofile:${{ github.sha }}

      - name: Push tested Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myprofile:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myprofile:${{ github.sha }}
