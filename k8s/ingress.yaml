apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myprofile
  namespace: myprofile
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myprofile
                port:
                  number: 80
# For a real domain, add:
#   host: myprofile.example.com
# under the rule above and point DNS to the EC2 public IP.
